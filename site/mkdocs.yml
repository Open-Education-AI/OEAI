# Material for MkDocs site over the OEAI public repository.
# The repository Markdown and notebooks are the source; nothing is authored under site/.
# Build locally:  pip install -r site/requirements.txt && mkdocs build -f site/mkdocs.yml
site_name: Open Education AI
site_description: The OEAI framework — reference architecture, partner integration guidance, modules, schema and guides.
site_url: https://open-education-ai.github.io/OEAI/
repo_url: https://github.com/Open-Education-AI/OEAI
repo_name: Open-Education-AI/OEAI
edit_uri: edit/main/
copyright: Apache-2.0 · Open Education AI

# The whole repository is the docs tree; the built site must sit outside it.
docs_dir: ..
site_dir: ../../OEAI-site

exclude_docs: |
  .git/
  .github/
  .worktrees/
  site/
  scripts/
  report/
  reference/
  cloud-infrastructure/
  node_modules/
  *.7z
  *.dbml
  *.docx
  *.png
  *.ps1
  .gitignore
  LICENSE

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: false
      include_source: true
      show_input: true

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true


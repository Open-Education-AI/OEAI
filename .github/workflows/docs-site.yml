name: docs-site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "modules/**"
      - "packages/**"
      - "site/**"
      - "README.md"
      - "ROADMAP.md"
      - "KNOWN_ISSUES.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: site/requirements.txt
      - run: pip install -r site/requirements.txt
      - run: mkdocs build --strict -f site/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ../OEAI-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
